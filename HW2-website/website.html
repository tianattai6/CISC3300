<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup's Bakery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Oswald", serif;
            margin: 15px;
            padding: 15px;
            text-align: center;
        }
        .header {
            background-color: #ffcc66;
            padding: 15px;
            border-bottom: 2px solid #d98c00;
        }
        .header nav a {
            margin: 30px;
            text-decoration: none;
            color: #6b3e26;
            font-weight: bold;
        }
        h1 {
            font-family: "Caveat", serif;
            color: #d98c00;
        }
        img {
            max-width: 80%;
            height: auto;
            margin: 25px;
        }
        form {
            margin-top: 20px;
            align-items: center;
        }
        label, input {
            display: block;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </nav>
    </div>
    
    <h1>Coup's Bakery</h1>
    <p>Welcome to Coup's Bakery, your go-to place for freshly baked goods made with love</p>
    
    <h2>Our Specialties</h2>
    <p>We offer a wide range of baked treats, including bread, pastries, and cakes that vary daily.</p>
    
    <img src="images/bakery.jpg" alt="Freshly baked bread and pastries">
    
    <h2>Contact Us</h2>
    <form>
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name">
        
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        
        <input type="submit" value="Submit">
    </form>
</body>
</html>
