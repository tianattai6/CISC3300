<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>inclass10</title>
        <style>

            #myDiv {
                padding: 20px;
                border: 1px solid #ccc;
                cursor: pointer;
                text-align: center;
                font-size: 20px;
                margin: 50px auto;
                width: 25%;
            }
        </style>
    </head>
    <body>

    <div id="myDiv" onclick="changeTextAndColor()">
        initial text
    </div>

    <script>
        function changeTextAndColor() {
            var div = document.getElementById("myDiv");

            div.textContent = "added text!";
            div.style.backgroundColor = "yellow";
        }
    </script>

    </body>
</html>
